<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>NOVA — Komuta-Merkezi Prototip-A (589)</title>
<style>
  /* ANAYASA: koyu tek-kimlik + ışıma-accent (A-yorumu: cyan-sınıfı, sinematik) */
  :root {
    --bg0:#04080d; --bg1:#071018; --ink:#d7e7ee; --muted:#5f7885;
    --glow:#38d3ff; --glow2:#7be8ff; --amber:#e8b34c; --abort:#ff6b5e; --go:#43e39a;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body {
    background: radial-gradient(1200px 700px at 50% 38%, var(--bg1), var(--bg0) 70%);
    color:var(--ink); font:13px/1.5 "Hanken Grotesk",system-ui,sans-serif; overflow:hidden;
    transition: filter 1.2s ease;
  }
  body[data-phase="FIX"] { filter: hue-rotate(-38deg); }
  body[data-phase="EVALUATE"] { filter: saturate(.75) brightness(.94); }
  .mono { font-family:"Geist Mono",ui-monospace,monospace; }
  #stage { position:fixed; inset:0; z-index:1; }
  /* üst-bant */
  .top { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; gap:14px; align-items:center;
    padding:10px 18px; font-family:"Geist Mono",monospace; font-size:11px; color:var(--muted); }
  .top b { color:var(--glow); font-weight:600; letter-spacing:.16em; }
  .top .ph { margin-left:auto; }
  .top .ph em { color:var(--glow2); font-style:normal; }
  /* telemetri-nehri */
  .river { position:fixed; left:50%; transform:translateX(-50%); bottom:86px; width:min(860px,92vw);
    max-height:200px; z-index:4; overflow:hidden; display:flex; flex-direction:column-reverse;
    mask-image:linear-gradient(180deg, transparent 0, black 34px); pointer-events:none; }
  .row { font:11.5px "Geist Mono",monospace; padding:1.5px 10px; display:flex; gap:10px;
    text-shadow:0 0 12px rgba(56,211,255,.14); animation:arr .45s ease-out; }
  @keyframes arr { from { opacity:0; transform:translateY(8px);} }
  .row .src { min-width:70px; }
  .row .txt { color:var(--ink); opacity:.86; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.dk .src { color:var(--glow); } .row.dk .txt { color:var(--glow2); opacity:1; }
  .row.me .src { color:var(--amber); }
  /* komuta-girdi */
  .cmd { position:fixed; left:50%; transform:translateX(-50%); bottom:26px; width:min(760px,90vw); z-index:6; }
  .cmd input {
    width:100%; background:rgba(7,16,24,.82); color:var(--ink);
    border:1px solid rgba(56,211,255,.35); border-radius:999px; outline:none;
    font:14px "Geist Mono",monospace; padding:13px 22px;
    box-shadow:0 0 0 1px rgba(56,211,255,.08), 0 0 34px rgba(56,211,255,.14), inset 0 0 24px rgba(56,211,255,.05);
    transition:box-shadow .3s ease, border-color .3s ease;
  }
  .cmd input:focus { border-color:var(--glow); box-shadow:0 0 0 1px rgba(56,211,255,.25), 0 0 54px rgba(56,211,255,.3); }
  .cmd .hint { text-align:center; color:var(--muted); font:10px "Geist Mono",monospace; margin-top:6px; letter-spacing:.1em; }
  /* worker-odak paneli */
  .focus { position:fixed; right:18px; top:52px; width:330px; z-index:5;
    background:rgba(7,16,24,.86); border:1px solid rgba(56,211,255,.25); border-radius:10px;
    padding:12px 14px; backdrop-filter:blur(6px); display:none; }
  .focus.on { display:block; }
  .focus h3 { font:12px "Geist Mono",monospace; color:var(--glow); }
  .focus .meta { font:10px "Geist Mono",monospace; color:var(--muted); margin:2px 0 8px; }
  .focus pre { font:10.5px "Geist Mono",monospace; color:var(--ink); opacity:.85; height:120px; overflow:hidden;
    white-space:pre-wrap; display:flex; flex-direction:column-reverse; }
  .idle-line { position:fixed; left:50%; top:31%; transform:translateX(-50%); z-index:3;
    font:12px "Geist Mono",monospace; color:var(--muted); letter-spacing:.22em; text-transform:uppercase;
    animation:breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{opacity:.35;} 50%{opacity:.8;} }
  @media (prefers-reduced-motion: reduce) { *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body data-phase="">
<canvas id="stage"></canvas>
<div class="top"><b>NOVA</b><span>komuta-merkezi · prototip-A</span>
  <span class="ph mono" id="phline">bağlanıyor…</span></div>
<div class="idle-line" id="idle" hidden>sistem hazır — emir bekleniyor</div>
<div class="focus" id="focus"><h3 id="ftitle"></h3><div class="meta" id="fmeta"></div><pre id="ffeed"></pre></div>
<div class="river" id="river"></div>
<div class="cmd">
  <input id="cmdin" class="mono" placeholder="deckent'e söyle — soru, emir, karar…" autocomplete="off">
  <div class="hint">enter=gönder · segment-tık=worker-odağı · gerçek-veri: canlı daemon</div>
</div>
<script>
(() => {
  // ── bağlantı (launcher hash'i) ──
  const H = Object.fromEntries(location.hash.slice(1).split('&').map(p => p.split('=')));
  const PORT = H.port || '3179', TOKEN = H.token || '';
  const BASE = `http://127.0.0.1:${PORT}`;
  const AUTH = { Authorization: 'Bearer ' + TOKEN };

  // ── durum ──
  const S = { workers: [], phase: null, sprintId: null, active: false, sel: null,
              pulse: new Map(), // taskId → {level, lastSeq}
              feeds: new Map(), es: new Map(), focusLines: [] };
  const river = document.getElementById('river');
  const WCOL = ['#38d3ff','#7be8ff','#43e39a','#e8b34c','#c792ea','#ff9e64','#6ce0c4','#f0a3c0'];

  function riverPush(src, txt, cls) {
    const d = document.createElement('div');
    d.className = 'row ' + (cls || '');
    d.innerHTML = '<span class="src mono"></span><span class="txt"></span>';
    d.children[0].textContent = src; d.children[1].textContent = txt;
    if (cls && cls.startsWith('w')) d.children[0].style.color = WCOL[+cls.slice(1) % WCOL.length];
    river.prepend(d);
    while (river.children.length > 12) river.removeChild(river.lastChild);
  }

  // ── canlı-veri: sprint-live poll ──
  async function poll() {
    try {
      const r = await fetch(BASE + '/api/sprint/live', { headers: AUTH });
      const d = await r.json();
      S.workers = d.workers || []; S.phase = d.phase; S.sprintId = d.sprintId; S.active = !!d.active;
      document.body.dataset.phase = d.phase || '';
      document.getElementById('phline').innerHTML = d.active
        ? `<em>${d.sprintId || 'sprint'}</em> · ${d.phase || '—'} · ${S.workers.length} worker`
        : 'sistem hazır';
      document.getElementById('idle').hidden = S.active;
      // hb-sequence değişimi = nabız-impulsu
      for (const w of S.workers) {
        const p = S.pulse.get(w.taskId) || { level: 0, lastSeq: -1 };
        const seq = w.hb ? (w.hb.sequence ?? 0) : -1;
        if (seq !== p.lastSeq) { p.level = Math.min(1, p.level + .5); p.lastSeq = seq; }
        S.pulse.set(w.taskId, p);
        ensureFeed(w.taskId);
      }
    } catch { document.getElementById('phline').textContent = 'daemon-bağlantısı yok'; }
  }
  setInterval(poll, 1000); poll();

  // ── canlı-veri: worker-log SSE'leri (sahne-doğuşlu nehir) ──
  function ensureFeed(id) {
    if (S.es.has(id)) return;
    const idx = S.workers.findIndex(w => w.taskId === id);
    const es = new EventSource(`${BASE}/api/workers/${encodeURIComponent(id)}/logs/stream?render=human&token=${TOKEN}`);
    es.addEventListener('log_line', (e) => {
      try {
        const ev = JSON.parse(e.data);
        const line = ev.line || '';
        riverPush(id, line, 'w' + (idx >= 0 ? idx : 0));
        const p = S.pulse.get(id) || { level: 0, lastSeq: -1 };
        p.level = Math.min(1, p.level + .35); S.pulse.set(id, p);
        if (S.sel === id) {
          S.focusLines = [line, ...S.focusLines].slice(0, 7);
          document.getElementById('ffeed').textContent = S.focusLines.join('\n');
        }
        sparks.push({ id, t: 0 });
      } catch {}
    });
    S.es.set(id, es);
  }

  // ── komuta: gerçek chat-stream ──
  const input = document.getElementById('cmdin');
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !input.value.trim()) return;
    const msg = input.value.trim(); input.value = '';
    riverPush('sen', msg, 'me');
    let buf = '';
    const es = new EventSource(`${BASE}/api/chat/stream?message=${encodeURIComponent(msg)}&token=${TOKEN}`);
    es.onmessage = (ev) => {
      try {
        const f = JSON.parse(ev.data);
        if (f.type === 'chunk') { buf += f.text; }
        if (f.type === 'done') { riverPush('deckent', (f.reply || buf).slice(0, 220), 'dk'); es.close(); }
        if (f.type === 'error') { riverPush('deckent', '⚠ ' + f.message, 'dk'); es.close(); }
      } catch {}
    };
  });

  // ── SAHNE: radial-çekirdek + yörünge-segmentleri + osiloskop (Canvas) ──
  const cv = document.getElementById('stage'), cx = cv.getContext('2d');
  const sparks = []; let W, Hh, t = 0;
  const fit = () => { W = cv.width = innerWidth * devicePixelRatio; Hh = cv.height = innerHeight * devicePixelRatio; };
  addEventListener('resize', fit); fit();
  const osc = []; for (let i = 0; i < 240; i++) osc.push(0);

  cv.addEventListener('click', (e) => {
    // segment-tık → odak
    const cxp = innerWidth / 2, cyp = innerHeight * .40;
    const dx = e.clientX - cxp, dy = e.clientY - cyp, r = Math.hypot(dx, dy);
    if (S.workers.length && r > 92 && r < 190) {
      const a = ((Math.atan2(dy, dx) + Math.PI * 2.5) % (Math.PI * 2));
      const i = Math.floor(a / (Math.PI * 2) * S.workers.length) % S.workers.length;
      const w = S.workers[i];
      S.sel = w.taskId; S.focusLines = [];
      document.getElementById('focus').classList.add('on');
      document.getElementById('ftitle').textContent = w.taskId + ' · ' + (w.agent || '');
      document.getElementById('fmeta').textContent = (w.model || '') + ' · ' + (w.hb ? w.hb.status : w.status);
      document.getElementById('ffeed').textContent = '';
    } else { S.sel = null; document.getElementById('focus').classList.remove('on'); }
  });

  function frame() {
    t += 1; cx.clearRect(0, 0, W, Hh);
    const dp = devicePixelRatio, cxp = W / 2, cyp = Hh * .40;
    const alive = S.active, breathe = alive ? 1 : (0.5 + 0.24 * Math.sin(t / 60));
    // arka-ambient halkalar
    for (let i = 3; i >= 1; i--) {
      cx.beginPath(); cx.arc(cxp, cyp, (150 + i * 60) * dp * (1 + (alive ? .006 : .012) * Math.sin(t / (40 + i * 9))), 0, 7);
      cx.strokeStyle = `rgba(56,211,255,${0.028 * breathe / i})`; cx.lineWidth = 1 * dp; cx.stroke();
    }
    // ÇEKİRDEK: faz-halkası + nabız
    const PH = ['PLAN','SPAWN','EXECUTE','EVALUATE','FIX','RETRO','DECAY','COMPLETE'];
    const pi = Math.max(0, PH.indexOf(S.phase));
    const coreR = 74 * dp * (1 + (alive ? .02 : .045) * Math.sin(t / 24));
    const grd = cx.createRadialGradient(cxp, cyp, coreR * .2, cxp, cyp, coreR * 1.9);
    grd.addColorStop(0, `rgba(123,232,255,${.34 * breathe})`); grd.addColorStop(1, 'rgba(56,211,255,0)');
    cx.fillStyle = grd; cx.beginPath(); cx.arc(cxp, cyp, coreR * 1.9, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(cxp, cyp, coreR, 0, 7);
    cx.strokeStyle = 'rgba(56,211,255,.7)'; cx.lineWidth = 1.6 * dp; cx.stroke();
    // faz-ilerleme yayı
    cx.beginPath(); cx.arc(cxp, cyp, coreR + 9 * dp, -Math.PI / 2, -Math.PI / 2 + ((pi + 1) / PH.length) * Math.PI * 2);
    cx.strokeStyle = 'rgba(123,232,255,.9)'; cx.lineWidth = 3 * dp; cx.lineCap = 'round'; cx.stroke();
    cx.fillStyle = 'rgba(215,231,238,.9)'; cx.font = `${11 * dp}px "Geist Mono",monospace`; cx.textAlign = 'center';
    cx.fillText(S.phase || (alive ? '…' : 'HAZIR'), cxp, cyp + 4 * dp);
    // YÖRÜNGE-SEGMENTLERİ: worker'lar
    const n = S.workers.length;
    for (let i = 0; i < n; i++) {
      const w = S.workers[i];
      const p = S.pulse.get(w.taskId) || { level: 0 };
      p.level = Math.max(0, p.level - 0.012); // sönüm
      const a0 = -Math.PI / 2 + (i / n) * Math.PI * 2 + 0.09, a1 = -Math.PI / 2 + ((i + 1) / n) * Math.PI * 2 - 0.09;
      const R = (128 + 10 * Math.sin(t / 50 + i)) * dp;
      const stale = w.hb && w.hb.ageMs > 30000;
      const col = stale ? '232,179,76' : '56,211,255';
      cx.beginPath(); cx.arc(cxp, cyp, R, a0, a1);
      cx.strokeStyle = `rgba(${col},${0.30 + 0.65 * p.level})`;
      cx.lineWidth = (5 + 9 * p.level) * dp; cx.lineCap = 'round'; cx.stroke();
      if (S.sel === w.taskId) { cx.beginPath(); cx.arc(cxp, cyp, R, a0, a1); cx.strokeStyle = 'rgba(255,255,255,.55)'; cx.lineWidth = 1.2 * dp; cx.stroke(); }
      const am = (a0 + a1) / 2, lx = cxp + Math.cos(am) * (R + 30 * dp), ly = cyp + Math.sin(am) * (R + 30 * dp);
      cx.fillStyle = `rgba(${col},.95)`; cx.font = `${10 * dp}px "Geist Mono",monospace`;
      cx.fillText(w.taskId, lx, ly);
      cx.fillStyle = 'rgba(95,120,133,.95)'; cx.font = `${8.5 * dp}px "Geist Mono",monospace`;
      cx.fillText((w.hb ? Math.round(w.hb.ageMs / 1000) + 's' : w.status), lx, ly + 12 * dp);
    }
    // satır-doğuş kıvılcımları: segment → nehre süzülen ışık
    for (let k = sparks.length - 1; k >= 0; k--) {
      const s = sparks[k]; s.t += 0.02;
      const i = S.workers.findIndex(w => w.taskId === s.id); if (i < 0) { sparks.splice(k, 1); continue; }
      const am = -Math.PI / 2 + ((i + .5) / S.workers.length) * Math.PI * 2;
      const sx = cxp + Math.cos(am) * 128 * dp, sy = cyp + Math.sin(am) * 128 * dp;
      const ty = Hh - 210 * dp, tx = cxp;
      const x = sx + (tx - sx) * s.t, y = sy + (ty - sy) * (s.t * s.t);
      cx.beginPath(); cx.arc(x, y, 2.4 * dp * (1 - s.t * .5), 0, 7);
      cx.fillStyle = `rgba(123,232,255,${.8 * (1 - s.t)})`; cx.fill();
      if (s.t >= 1) sparks.splice(k, 1);
    }
    // OSİLOSKOP: seçili-worker'ın canlı-izi (çekirdeğin altında)
    const p = S.sel ? (S.pulse.get(S.sel) || { level: 0 }) : null;
    osc.push(p ? p.level : (alive ? 0.05 : 0.02 + 0.02 * Math.sin(t / 9)));
    osc.shift();
    cx.beginPath();
    const oy = cyp + 235 * dp, ow = Math.min(560 * dp, W * .6), ox = cxp - ow / 2;
    for (let i = 0; i < osc.length; i++) {
      const x = ox + (i / osc.length) * ow;
      const y = oy - osc[i] * 46 * dp * (1 + .3 * Math.sin(i / 3 + t / 5));
      i ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    cx.strokeStyle = S.sel ? 'rgba(123,232,255,.85)' : 'rgba(56,211,255,.3)';
    cx.lineWidth = 1.4 * dp; cx.shadowColor = '#38d3ff'; cx.shadowBlur = 12 * dp; cx.stroke(); cx.shadowBlur = 0;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

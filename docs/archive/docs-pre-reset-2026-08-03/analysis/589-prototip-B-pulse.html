<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>PULSE — Komuta-Merkezi Prototip-B (589)</title>
<style>
  /* ANAYASA: koyu tek-kimlik + ışıma-accent (B-yorumu: amber-enstrüman, keskin-minimal) */
  :root {
    --bg:#0a0b0d; --panel:#0e1013; --line:#1d2126; --ink:#e6e1d6; --muted:#6d6a60;
    --amp:#ffb454; --amp2:#ffd394; --cyan:#59c2ff; --go:#7fd962; --abort:#f07178;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font:13px/1.5 "Hanken Grotesk",system-ui,sans-serif; overflow:hidden; }
  body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background: repeating-linear-gradient(90deg, transparent 0 119px, rgba(255,180,84,.025) 119px 120px),
                repeating-linear-gradient(0deg, transparent 0 119px, rgba(255,180,84,.02) 119px 120px); }
  body[data-phase="FIX"] .edge { background:var(--abort); }
  body[data-phase="EVALUATE"] .edge { background:var(--cyan); }
  .mono { font-family:"Geist Mono",ui-monospace,monospace; }
  .edge { position:fixed; top:0; left:0; right:0; height:2px; background:var(--amp); z-index:9;
    box-shadow:0 0 14px rgba(255,180,84,.5); transition:background .8s ease; }
  .top { position:fixed; top:2px; left:0; right:0; z-index:8; display:flex; align-items:center; gap:16px;
    padding:9px 16px; font:10px "Geist Mono",monospace; letter-spacing:.14em; color:var(--muted);
    border-bottom:1px solid var(--line); background:rgba(10,11,13,.9); text-transform:uppercase; }
  .top b { color:var(--amp); }
  .top .ring { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .top .ring svg { display:block; }
  .top .ring .ph { color:var(--amp2); }
  /* osiloskop-yığını */
  #lanes { position:fixed; top:38px; left:0; right:0; bottom:196px; z-index:2; overflow-y:auto; }
  .lane { position:relative; height:84px; border-bottom:1px solid var(--line); cursor:pointer; }
  .lane:hover { background:rgba(255,180,84,.02); }
  .lane.sel { background:rgba(255,180,84,.045); }
  .lane .id { position:absolute; left:14px; top:10px; z-index:2; }
  .lane .id code { color:var(--amp); font-size:12px; }
  .lane .id .who { color:var(--muted); font:9px "Geist Mono",monospace; text-transform:uppercase; letter-spacing:.12em; display:block; }
  .lane .st { position:absolute; right:14px; top:10px; z-index:2; text-align:right;
    font:9.5px "Geist Mono",monospace; color:var(--muted); }
  .lane .st b { color:var(--go); font-weight:600; } .lane.stale .st b { color:var(--amp); }
  .lane canvas { position:absolute; inset:0; width:100%; height:100%; }
  .lane .birth { position:absolute; left:150px; right:170px; bottom:4px; z-index:2;
    font:10px "Geist Mono",monospace; color:var(--amp2); opacity:0; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .lane .birth.show { animation:birth 2.6s ease-out; }
  @keyframes birth { 0%{opacity:0; transform:translateY(-26px);} 12%{opacity:1;} 78%{opacity:.9; transform:translateY(0);} 100%{opacity:0;} }
  .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font:11px "Geist Mono",monospace; color:var(--muted); letter-spacing:.24em; text-transform:uppercase; }
  /* nehir */
  .river { position:fixed; left:0; right:0; bottom:64px; height:126px; z-index:3;
    border-top:1px solid var(--line); background:var(--panel); overflow:hidden;
    display:flex; flex-direction:column-reverse; padding:4px 0; }
  .row { font:11px "Geist Mono",monospace; padding:1px 16px; display:flex; gap:12px; }
  .row .src { min-width:78px; color:var(--muted); }
  .row .txt { opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.dk .src { color:var(--amp); } .row.dk .txt { color:var(--amp2); opacity:1; }
  .row.me .src { color:var(--cyan); }
  /* komuta */
  .cmd { position:fixed; left:0; right:0; bottom:0; height:64px; z-index:7; display:flex; align-items:center;
    gap:12px; padding:0 16px; border-top:1px solid var(--amp); background:var(--panel); }
  .cmd .p { color:var(--amp); font:15px "Geist Mono",monospace; }
  .cmd input { flex:1; background:none; border:none; outline:none; color:var(--ink);
    font:14px "Geist Mono",monospace; caret-color:var(--amp); }
  .cmd .k { font:9px "Geist Mono",monospace; color:var(--muted); border:1px solid var(--line);
    padding:2px 7px; border-radius:3px; }
  @media (prefers-reduced-motion: reduce) { *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body data-phase="">
<div class="edge"></div>
<div class="top"><b>PULSE</b><span>komuta-merkezi · prototip-B</span>
  <span id="topline">bağlanıyor…</span>
  <span class="ring"><svg id="phring" width="22" height="22" viewBox="0 0 22 22"></svg><span class="ph mono" id="phtxt"></span></span></div>
<div id="lanes"><div class="empty" id="empty">sistem hazır — emir bekleniyor</div></div>
<div class="river" id="river"></div>
<div class="cmd"><span class="p">❯</span>
  <input id="cmdin" placeholder="deckent'e söyle — soru, emir, karar…" autocomplete="off">
  <span class="k">ENTER</span></div>
<script>
(() => {
  const H = Object.fromEntries(location.hash.slice(1).split('&').map(p => p.split('=')));
  const PORT = H.port || '3179', TOKEN = H.token || '';
  const BASE = `http://127.0.0.1:${PORT}`;
  const AUTH = { Authorization: 'Bearer ' + TOKEN };
  const PH = ['PLAN','SPAWN','EXECUTE','EVALUATE','FIX','RETRO','DECAY','COMPLETE'];

  const S = { workers: [], sel: null, lanes: new Map(), es: new Map(), pulse: new Map() };
  const lanesEl = document.getElementById('lanes'), river = document.getElementById('river');

  function riverPush(src, txt, cls) {
    const d = document.createElement('div'); d.className = 'row ' + (cls || '');
    d.innerHTML = '<span class="src"></span><span class="txt"></span>';
    d.children[0].textContent = src; d.children[1].textContent = txt;
    river.prepend(d);
    while (river.children.length > 9) river.removeChild(river.lastChild);
  }

  // ── şerit-yönetimi (DOM + şerit-başına canvas-iz) ──
  function laneFor(w) {
    if (S.lanes.has(w.taskId)) return S.lanes.get(w.taskId);
    const el = document.createElement('div');
    el.className = 'lane';
    el.innerHTML = '<div class="id"><code></code><span class="who"></span></div>' +
      '<canvas></canvas><div class="st"></div><div class="birth"></div>';
    el.querySelector('code').textContent = w.taskId;
    el.onclick = () => { S.sel = S.sel === w.taskId ? null : w.taskId;
      document.querySelectorAll('.lane').forEach(l => l.classList.remove('sel'));
      if (S.sel) el.classList.add('sel'); };
    lanesEl.appendChild(el);
    const trace = []; for (let i = 0; i < 300; i++) trace.push(0);
    const rec = { el, trace };
    S.lanes.set(w.taskId, rec);
    openFeed(w.taskId, el);
    return rec;
  }

  function openFeed(id, laneEl) {
    if (S.es.has(id)) return;
    const es = new EventSource(`${BASE}/api/workers/${encodeURIComponent(id)}/logs/stream?render=human&token=${TOKEN}`);
    es.addEventListener('log_line', (e) => {
      try {
        const line = JSON.parse(e.data).line || '';
        const p = S.pulse.get(id) || { level: 0 }; p.level = Math.min(1, p.level + .45); S.pulse.set(id, p);
        // sahne-içi doğuş: satır şeridin ÜSTÜNDE belirir, sonra nehre iner
        const b = laneEl.querySelector('.birth');
        b.textContent = line; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
        setTimeout(() => riverPush(id, line, ''), 900);
      } catch {}
    });
    S.es.set(id, es);
  }

  // ── canlı-poll ──
  async function poll() {
    try {
      const r = await fetch(BASE + '/api/sprint/live', { headers: AUTH });
      const d = await r.json();
      S.workers = d.workers || [];
      document.body.dataset.phase = d.phase || '';
      document.getElementById('topline').textContent = d.active
        ? `${d.sprintId || 'sprint'} · ${S.workers.length} worker` : 'sistem hazır';
      document.getElementById('phtxt').textContent = d.phase || (d.active ? '…' : 'HAZIR');
      document.getElementById('empty').style.display = d.active ? 'none' : 'flex';
      // faz-halkası (mini, keskin)
      const pi = Math.max(0, PH.indexOf(d.phase)); const frac = d.active ? (pi + 1) / PH.length : 0;
      const R = 8, C = 2 * Math.PI * R;
      document.getElementById('phring').innerHTML =
        `<circle cx="11" cy="11" r="${R}" fill="none" stroke="#1d2126" stroke-width="2.5"/>` +
        `<circle cx="11" cy="11" r="${R}" fill="none" stroke="var(--amp)" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="${C * frac} ${C}" transform="rotate(-90 11 11)"/>`;
      for (const w of S.workers) {
        const rec = laneFor(w);
        rec.el.querySelector('.who').textContent = (w.agent || '') + (w.model ? ' · ' + w.model : '');
        const hb = w.hb, stale = hb && hb.ageMs > 30000;
        rec.el.classList.toggle('stale', !!stale);
        rec.el.querySelector('.st').innerHTML =
          `<b>${hb ? hb.status : w.status}</b> · hb ${hb ? Math.round(hb.ageMs / 1000) + 's' : '—'}<br>` +
          `${hb && hb.filesChangedCount !== undefined ? hb.filesChangedCount + ' dosya' : ''}` +
          `${hb && hb.currentAction ? '<br>' + hb.currentAction.slice(0, 34) : ''}`;
        const p = S.pulse.get(w.taskId) || { level: 0, lastSeq: -1 };
        const seq = hb ? (hb.sequence ?? 0) : -1;
        if (seq !== p.lastSeq) { p.level = Math.min(1, p.level + .4); p.lastSeq = seq; }
        S.pulse.set(w.taskId, p);
      }
      // kaybolan şeritler (arşivlenen sprint) — dürüstçe kalksın
      for (const [id, rec] of S.lanes) {
        if (!S.workers.some(w => w.taskId === id)) { rec.el.remove(); S.lanes.delete(id); S.es.get(id)?.close(); S.es.delete(id); }
      }
    } catch { document.getElementById('topline').textContent = 'daemon-bağlantısı yok'; }
  }
  setInterval(poll, 1000); poll();

  // ── iz-çizimi: her şerit kendi keskin-osiloskopu ──
  function draw() {
    for (const [id, rec] of S.lanes) {
      const c = rec.el.querySelector('canvas');
      const w = c.clientWidth * devicePixelRatio, h = c.clientHeight * devicePixelRatio;
      if (c.width !== w) c.width = w; if (c.height !== h) c.height = h;
      const g = c.getContext('2d'); g.clearRect(0, 0, w, h);
      const p = S.pulse.get(id) || { level: 0 };
      p.level = Math.max(0, p.level - 0.014);
      const stale = rec.el.classList.contains('stale');
      rec.trace.push(stale ? p.level * .3 : p.level); rec.trace.shift();
      // merkez-çizgi
      g.strokeStyle = 'rgba(255,180,84,.09)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, h * .62); g.lineTo(w, h * .62); g.stroke();
      // iz — keskin, glow'suz-nete yakın
      g.beginPath();
      for (let i = 0; i < rec.trace.length; i++) {
        const x = (i / rec.trace.length) * w;
        const jag = rec.trace[i] > .04 ? (Math.sin(i * 1.7) * .5 + Math.sin(i * .61) * .5) : 0;
        const y = h * .62 - rec.trace[i] * h * .44 * (0.72 + 0.28 * jag);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.strokeStyle = stale ? 'rgba(255,180,84,.5)' : (S.sel === id ? '#ffd394' : 'rgba(255,180,84,.8)');
      g.lineWidth = (S.sel === id ? 1.8 : 1.2) * devicePixelRatio;
      g.stroke();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ── komuta: gerçek chat-stream ──
  const input = document.getElementById('cmdin');
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !input.value.trim()) return;
    const msg = input.value.trim(); input.value = '';
    riverPush('sen', msg, 'me');
    let buf = '';
    const es = new EventSource(`${BASE}/api/chat/stream?message=${encodeURIComponent(msg)}&token=${TOKEN}`);
    es.onmessage = (ev) => {
      try {
        const f = JSON.parse(ev.data);
        if (f.type === 'chunk') buf += f.text;
        if (f.type === 'done') { riverPush('deckent', (f.reply || buf).slice(0, 220), 'dk'); es.close(); }
        if (f.type === 'error') { riverPush('deckent', '⚠ ' + f.message, 'dk'); es.close(); }
      } catch {}
    };
  });
})();
</script>
</body>
</html>

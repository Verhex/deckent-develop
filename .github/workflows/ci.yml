name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run lint

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: npm audit (high severity)
        run: npm audit --audit-level=high

  test-core:
    name: Tests — Core + Agents
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run core tests
        run: npx vitest run tests/core/ tests/agents/
        timeout-minutes: 5

  test-orchestra:
    name: Tests — Orchestra
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run orchestra tests
        run: npx vitest run tests/orchestra/
        timeout-minutes: 5

  test-cli:
    name: Tests — CLI
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run CLI tests
        run: npx vitest run tests/cli/
        timeout-minutes: 10

  test-remaining:
    name: Tests — MCP + API + Integration + Security + Providers + Monitor + Skills + Analytics
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run remaining tests
        run: npx vitest run tests/mcp/ tests/api/ tests/integration/ tests/security/ tests/providers/ tests/monitor/ tests/skills/ tests/analytics/ tests/github/
        timeout-minutes: 10

  test-docs-scripts:
    name: Tests — Docs + Scripts (isolated)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Run docs and scripts tests
        run: npx vitest run tests/docs/ tests/scripts/
        timeout-minutes: 5

  test-dashboard:
    name: Tests — Dashboard
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Install dashboard dependencies
        run: npm install --prefix src/dashboard --ignore-scripts 2>/dev/null || true
      - name: Run dashboard tests
        run: npm run test:dashboard
        timeout-minutes: 5

  test-windows:
    name: Tests — Windows (allow-failure)
    runs-on: windows-latest
    # Windows is unsupported — this job is informational only
    continue-on-error: true
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Run core tests (Windows informational)
        run: npx vitest run tests/core/ tests/agents/
        timeout-minutes: 10
        continue-on-error: true

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-core, test-orchestra, test-cli, test-remaining]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
        timeout-minutes: 20
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-core, test-orchestra, test-cli, test-remaining, test-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist
        run: |
          test -f dist/cli/index.js
          test -f dist/cli/entry.js
          test -f dist/mcp/server.js
          test -f dist/index.js
          head -1 dist/cli/entry.js | grep -q "#!/usr/bin/env node"
          head -1 dist/mcp/server.js | grep -q "#!/usr/bin/env node"

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test-core:
    name: Tests — Core + Agents
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run core tests
        run: npx vitest run tests/core/ tests/agents/
        timeout-minutes: 5

  test-orchestra:
    name: Tests — Orchestra
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run orchestra tests
        run: npx vitest run tests/orchestra/
        timeout-minutes: 5

  test-cli:
    name: Tests — CLI
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run CLI tests
        run: npx vitest run tests/cli/
        timeout-minutes: 5

  test-remaining:
    name: Tests — MCP + API + Integration + Security + Providers + Monitor + Docs + Skills + Analytics
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run remaining tests
        run: npx vitest run tests/mcp/ tests/api/ tests/integration/ tests/security/ tests/providers/ tests/monitor/ tests/docs/ tests/skills/ tests/analytics/ tests/scripts/
        timeout-minutes: 10

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-core, test-orchestra, test-cli, test-remaining]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist
        run: |
          test -f dist/cli/index.js
          test -f dist/mcp/server.js
          test -f dist/index.js
          head -1 dist/cli/index.js | grep -q "#!/usr/bin/env node"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Install dashboard dependencies
        run: npm ci --prefix src/dashboard --ignore-scripts
      - run: npm run lint
      - name: MCP Instructions lint (tool count drift guard)
        run: node scripts/lint-mcp-instructions.mjs

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: npm audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  test-core:
    name: Tests — Core + Agents
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        # Node 18/20/22 dropped — all EOL by May 2026:
        # - v18 EOL Apr 2025 (1+ year dead)
        # - v20 (Iron) Maintenance EOL Mar 2026
        # - v22 (Jod) Maintenance EOL May 2026 (this month)
        # Active LTS = v24 (Krypton, until May 2027). v26 = Current.
        # better-sqlite3 v12.10.0 prebuilds: v24 + v26 (v20/v23 removed).
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Run core tests
        run: npx vitest run tests/core/ tests/agents/
        timeout-minutes: 5

  test-orchestra:
    name: Tests — Orchestra
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Run orchestra tests
        # Orchestra suite is large (~118 test files) — historical OOM on default
        # 2GB heap. Bumped to 8GB + forks pool (isolated workers, no shared state).
        # See Sprint 141 CI fix: pre-existing Sprint 139 regression.
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx vitest run tests/orchestra/ --pool=forks
        timeout-minutes: 10

  test-cli:
    name: Tests — CLI
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Run CLI tests
        run: npx vitest run tests/cli/
        timeout-minutes: 10

  test-remaining:
    name: Tests — MCP + API + Integration + Security + Providers + Monitor + Skills + Analytics
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Run remaining tests
        run: npx vitest run tests/mcp/ tests/api/ tests/integration/ tests/security/ tests/providers/ tests/monitor/ tests/skills/ tests/analytics/ tests/github/
        timeout-minutes: 10

  test-docs-scripts:
    name: Tests — Docs + Scripts (isolated)
    runs-on: ubuntu-latest
    needs: typecheck
    # Vitest worker timeout (onTaskUpdate) is a known flaky issue in CI.
    # Tests pass (508/508) but vitest exits with code 1 due to worker crash.
    # Coverage job runs these same tests — this job is supplementary.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Run docs and scripts tests
        run: npx vitest run tests/docs/ tests/scripts/ --pool=forks
        timeout-minutes: 5

  test-dashboard:
    name: Tests — Dashboard
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Install dashboard dependencies
        run: npm install --prefix src/dashboard --ignore-scripts 2>/dev/null || true
      - name: Run dashboard tests
        run: npm run test:dashboard
        timeout-minutes: 5

  test-windows:
    name: Tests — Windows (allow-failure)
    runs-on: windows-latest
    # Windows is unsupported — this job is informational only
    continue-on-error: true
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Run core tests (Windows informational)
        run: npx vitest run tests/core/ tests/agents/
        timeout-minutes: 10
        continue-on-error: true

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-core, test-orchestra, test-cli, test-remaining]
    # Sprint 189 (WrongStack WS-Z1): coverage gate aktif.
    # vitest.config.ts içindeki coverage.thresholds (lines/functions/branches/statements)
    # ihlal edilirse vitest non-zero exit verir, npm run propagates, bu job FAIL olur,
    # build kırılır (no continue-on-error). Floors mevcut baseline'dan -5%
    # kalibre; sprint başına ~1% ratchet politikası (CONTRIBUTING.md).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Run tests with coverage (threshold gate enforced)
        # Threshold violation = exit 1 = job FAIL = CI red.
        run: npm run test:coverage
        timeout-minutes: 20
      - name: Upload coverage report
        # always() — eşik ihlali durumunda bile rapor artefakt olarak yüklensin
        # ki contributor coverage farkını görebilsin.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-core, test-orchestra, test-cli, test-remaining, test-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run ci:rebuild-native
      - name: Install dashboard dependencies
        run: npm install --prefix src/dashboard --ignore-scripts 2>/dev/null || true
      - run: npm run build
      - name: Verify dist
        run: |
          test -f dist/cli/index.js
          test -f dist/cli/entry.js
          test -f dist/mcp/server.js
          test -f dist/index.js
          head -1 dist/cli/entry.js | grep -q "#!/usr/bin/env node"
          head -1 dist/mcp/server.js | grep -q "#!/usr/bin/env node"

name: Build and Deploy Docs

# ⏸ PAUSED 2026-08-02 (Alperen). This workflow runs `npx vitepress build` against
# docs/.vitepress/**, which the 2026-08 docs reset moved to
# docs/archive/docs-pre-reset-2026-08-03/. Every automatic run therefore fails.
# Whether the nested VitePress site continues or is absorbed by the root toolchain is
# OQ-18 (docs/analysis/OPEN-QUESTIONS-2026-08.md) — an open owner decision, revisited in
# PAZARTESI.md FAZ 3. Until then the automatic triggers are disabled so a known-broken
# deploy stops reporting red; manual dispatch is kept so the decision can be tested.
# Restore by re-enabling the push/pull_request blocks below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'docs/**'
  #     - '.github/workflows/docs.yml'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native binding (better-sqlite3)
        run: npm run ci:rebuild-native

      - name: Install docs dependencies
        run: npm install --prefix docs

      - name: Install dashboard dependencies
        run: npm ci --prefix src/dashboard --ignore-scripts

      - name: Type check
        run: npm run lint

      - name: Build docs
        run: npx vitepress build
        working-directory: docs

      - name: Create CNAME file for custom domain
        run: echo "docs.deckent.agency" > docs/.vitepress/dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deploy job — enable by configuring Settings → Pages → Source: "GitHub Actions".
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # born-608 (task 407-001): repo's default/main branch is `main`, not `master` — the
    # old condition never matched, so this job was permanently dead.
    # CC follow-up (2026-07-11): reviving the job exposed that GitHub Pages is NOT
    # enabled on this repo (deploy-pages 404 on 8b69c8f5) — the dead condition had
    # been hiding the missing setting. Gate on an explicit repo variable so the job
    # SKIPS honestly (not red) until Alperen enables Pages (Settings → Pages) and
    # sets the repo variable DECKENT_PAGES_ENABLED=true.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DECKENT_PAGES_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

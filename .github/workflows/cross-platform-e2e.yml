name: Cross-Platform E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E — ${{ matrix.os }} / ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        backend: [tmux, subprocess]
        exclude:
          - os: macos-latest
            backend: subprocess
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run ci:rebuild-native

      - run: npm run build

      - name: Install tmux (macOS)
        if: matrix.backend == 'tmux' && matrix.os == 'macos-latest'
        run: brew install tmux

      - name: Install tmux (Ubuntu)
        if: matrix.backend == 'tmux' && matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Verify tmux version
        if: matrix.backend == 'tmux'
        run: tmux -V

      - name: Run cross-platform E2E tests
        run: npx vitest run tests/e2e/cross-platform/ --reporter=verbose
        timeout-minutes: 10
        env:
          DECKENT_E2E_BACKEND: ${{ matrix.backend }}
          DECKENT_E2E_PLATFORM: ${{ matrix.os }}

  # WSL-note (XPLAT-01, honest-gap disclosure): this matrix intentionally has NO
  # separate WSL leg. Installing/bootstrapping WSL2 inside a windows-latest GitHub
  # Actions runner is fragile and would not be a faithful proxy for a real user's
  # WSL environment. WSL evidence instead comes from (a) Alperen's own local WSL2
  # environment and (b) POSIX-parity: WSL2 runs a real Linux kernel, so the
  # ubuntu-latest leg below already exercises the same code path WSL2 users hit.
  # This is a documented, deliberate gap — not a silent omission.
  packed-install:
    name: Packed Install — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # born-695: 20 → 28. The smoke's install timeout grew 180s→360s (slow
    # windows runners legitimately need ~5min for the native-binding install)
    # and the bounded ×2 retry doubles that worst case — the old 20min ceiling
    # would have converted a slow-but-passing second attempt into a job kill.
    # Required-status stays untouched; this is only the time budget.
    timeout-minutes: 28
    env:
      # Real npm-level retry (make-fetch-happen) layered under the bounded
      # bash retry loops below — absorbs transient registry blips inside a
      # single npm invocation. Job-scoped so it also reaches the npm pack /
      # npm install -g calls xplat-install-smoke.mjs makes internally (it
      # inherits process.env) without editing that script (out of scope here).
      npm_config_fetch_retries: '3'
      npm_config_fetch_retry_factor: '2'
      npm_config_fetch_retry_mintimeout: '5000'
      npm_config_fetch_retry_maxtimeout: '60000'
      npm_config_fetch_timeout: '300000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: npm install (npm ci, bounded retry)
        shell: bash
        run: |
          set -uo pipefail
          max_attempts=2
          attempt=1
          until npm ci; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::npm ci failed after ${max_attempts} attempt(s)" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "npm ci failed — retrying (attempt ${attempt}/${max_attempts}) after 30s..." >&2
            sleep 30
          done

      - run: npm run ci:rebuild-native

      - run: npm run build:all

      - name: Packed-install smoke — npm pack → isolated-prefix global install → deckent init --yes → deckent doctor (bounded retry)
        shell: bash
        timeout-minutes: 18
        run: |
          set -uo pipefail
          max_attempts=2
          attempt=1
          until node scripts/xplat-install-smoke.mjs; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::packed-install smoke (npm pack path) failed after ${max_attempts} attempt(s)" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "packed-install smoke failed — retrying (attempt ${attempt}/${max_attempts}) after 30s..." >&2
            sleep 30
          done

      # born-695: upload-artifact v4 rejects files OUTSIDE the workspace
      # ("rootDirectory is not a parent directory" — the windows npm cache
      # lives at C:\npm\cache while the workspace is on D:), which silently
      # destroyed the diagnostics on the exact failure they were added for.
      # Copy everything INTO the workspace first, then upload from there.
      - name: Collect diagnostics into workspace
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p xplat-diag
          npm_cache_dir="$(npm config get cache 2>/dev/null)"
          if [ -z "$npm_cache_dir" ]; then
            npm_cache_dir="$HOME/.npm"
          fi
          if [ -d "${npm_cache_dir}/_logs" ]; then
            cp -r "${npm_cache_dir}/_logs" xplat-diag/npm-logs || true
          fi
          cp .tasks/task-*.log xplat-diag/ 2>/dev/null || true
          ls -la xplat-diag/ || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packed-install-diagnostics-${{ matrix.os }}
          # npm debug log (registry/pack/install failures) + any tmux
          # pipe-pane worker log the smoke run may have produced
          # (src/orchestra/tmux.ts) — no dedicated "server log" file exists
          # in this codebase; if-no-files-found: ignore keeps this honest
          # for legs where neither path materializes.
          path: xplat-diag/**
          if-no-files-found: ignore
          retention-days: 7

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native binding (better-sqlite3)
        run: npm run ci:rebuild-native

      - name: Type check (lint)
        run: npm run lint

      - name: Run tests (staged to avoid OOM)
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          npx vitest run tests/core/ tests/agents/
          npx vitest run tests/orchestra/ --pool=forks
          npx vitest run tests/cli/
          npx vitest run tests/mcp/ tests/api/ tests/integration/ tests/security/ tests/providers/ tests/monitor/ tests/docs/ tests/skills/ tests/analytics/ tests/scripts/
        timeout-minutes: 15

      - name: Build
        run: npm run build

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f docs/CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[?v?${VERSION}\]?|^## ${VERSION}/{found=1; next} found && /^## /{exit} found{print}" docs/CHANGELOG.md | head -100)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi
          echo "$NOTES" > /tmp/release-notes.txt
          echo "notes_file=/tmp/release-notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: |
            dist/**/*
          generate_release_notes: true

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 30

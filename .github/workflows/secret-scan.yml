name: Secret Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  secret-scan:
    name: Pre-flip secret baseline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run secret scan
        run: node scripts/security/secret-baseline.mjs
